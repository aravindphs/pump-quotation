<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N Square Energies - Solar Pump Quotation Generator</title>
<style>
:root{
  --ink:#0f1b16; --muted:#5b6b64; --line:#e2e8e4; --bg:#f4f7f5; --card:#ffffff;
  --green:#0f6b4c; --green-2:#0a4d38; --navy:#0b2e4e; --accent:#0f6b4c;
  --danger:#b3261e; --danger-bg:#fdecea; --warn-bg:#fff4e5; --warn-ink:#8a5a00;
  --ok-bg:#eaf6ef; --sent-bg:#eef2ff; --rej-bg:#fdecea; --draft-bg:#f1f3f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#e8f1ec; --muted:#9db3aa; --line:#233a30; --bg:#0d1512; --card:#101c17;
    --green:#3ecb95; --green-2:#2fae7e; --navy:#7fb2df; --accent:#3ecb95;
    --danger:#ff6b60; --danger-bg:#3a1613; --warn-bg:#3a2a06; --warn-ink:#ffcf7a;
    --ok-bg:#123324; --sent-bg:#1b2440; --rej-bg:#3a1613; --draft-bg:#1a231e;
  }
}
:root[data-theme="dark"]{
  --ink:#e8f1ec; --muted:#9db3aa; --line:#233a30; --bg:#0d1512; --card:#101c17;
  --green:#3ecb95; --green-2:#2fae7e; --navy:#7fb2df; --accent:#3ecb95;
  --danger:#ff6b60; --danger-bg:#3a1613; --warn-bg:#3a2a06; --warn-ink:#ffcf7a;
  --ok-bg:#123324; --sent-bg:#1b2440; --rej-bg:#3a1613; --draft-bg:#1a231e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45;
}
button{font-family:inherit;}
.hidden{display:none;}
.muted{color:var(--muted);}
.accent{color:var(--accent);}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.max-w-6xl{max-width:1152px;}
.max-w-3xl{max-width:768px;}
.mx-auto{margin-left:auto;margin-right:auto;}
.min-w-0{min-width:0;}
.w-full{width:100%;}
.flex{display:flex;}
.grid{display:grid;}
.hidden{display:none;}
.items-center{align-items:center;}
.items-start{align-items:flex-start;}
.items-baseline{align-items:baseline;}
.justify-between{justify-content:space-between;}
.justify-center{justify-content:center;}
.gap-1\.5{gap:6px;}
.gap-2{gap:8px;}
.gap-2\.5{gap:10px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.gap-6{gap:24px;}
.flex-wrap{flex-wrap:wrap;}
.flex-1{flex:1;}
.space-y-3>*+*{margin-top:12px;}
.space-y-4>*+*{margin-top:16px;}
.px-4{padding-left:16px;padding-right:16px;}
.py-1{padding-top:4px;padding-bottom:4px;}
.py-4{padding-top:16px;padding-bottom:16px;}
.py-5{padding-top:20px;padding-bottom:20px;}
.p-3{padding:12px;}
.p-4{padding:16px;}
.p-5{padding:20px;}
.p-8{padding:32px;}
.pt-2{padding-top:8px;}
.mt-1{margin-top:4px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mt-4{margin-top:16px;}
.mb-1{margin-bottom:4px;}
.mb-2{margin-bottom:8px;}
.mb-3{margin-bottom:12px;}
.mb-4{margin-bottom:16px;}
.mb-5{margin-bottom:20px;}
.mb-6{margin-bottom:24px;}
.pb-28{padding-bottom:112px;}
.h-16{height:64px;}
.h-9{height:36px;}
.w-9{width:36px;}
.text-right{text-align:right;}
.text-center{text-align:center;}
.text-sm{font-size:13px;}
.text-xs{font-size:11.5px;}
.text-lg{font-size:18px;}
.text-2xl{font-size:26px;}
.text-3xl{font-size:30px;}
.font-medium{font-weight:500;}
.font-semibold{font-weight:600;}
.font-bold{font-weight:700;}
.font-extrabold{font-weight:800;}
.relative{position:relative;}
.absolute{position:absolute;}
.left-3{left:12px;}
.right-3{right:12px;}
.top-1\/2{top:50%;}
.-translate-y-1\/2{transform:translateY(-50%);}
.overflow-x-auto{overflow-x:auto;}
.cursor-pointer{cursor:pointer;}
.object-contain{object-fit:contain;}
.rounded-xl{border-radius:12px;}
@media (min-width:640px){
  .sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .sm\:col-span-2{grid-column:span 2/span 2;}
  .sm\:inline{display:inline;}
  .sm\:py-8{padding-top:32px;padding-bottom:32px;}
}
@media (min-width:768px){
  .md\:hidden{display:none;}
  .md\:block{display:block;}
}
@media (min-width:1024px){
  .lg\:hidden{display:none;}
  .lg\:block{display:block;}
  .lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .lg\:grid-cols-\[minmax\(0\,1fr\)_400px\]{grid-template-columns:minmax(0,1fr) 400px;}
  .lg\:sticky{position:sticky;}
  .lg\:top-20{top:80px;}
}
@media (min-width:1280px){
  .xl\:grid-cols-\[minmax\(0\,1fr\)_520px\]{grid-template-columns:minmax(0,1fr) 520px;}
}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}

/* ---- top bar ---- */
.topbar{position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
.brand-name{font-weight:800; letter-spacing:.2px; font-size:16px;}
.navbtn{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; border:none; background:transparent; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer;}
.navbtn span:last-child{display:none;}
.navbtn.on{background:var(--ok-bg); color:var(--accent);}
@media (min-width:640px){ .navbtn span:last-child{display:inline;} }

/* ---- layout basics ---- */
.page-title{font-size:22px; font-weight:800; margin:0;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px;}
.sec-title{font-size:15px; font-weight:700; margin:0;}
.sec-h{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px;}

/* ---- form elements ---- */
.lbl{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:4px;}
.req{color:var(--danger);}
.inp{width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:15px; outline:none; transition:border-color .12s;}
.inp:focus{border-color:var(--accent); background:var(--card);}
.inp-err{border-color:var(--danger); background:var(--danger-bg);}
textarea.inp{resize:vertical; font-family:inherit;}
.fix{position:absolute; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none;}
.hint{display:block; font-size:11.5px; color:var(--muted); margin-top:4px;}
.err{display:block; font-size:11.5px; color:var(--danger); margin-top:4px; font-weight:600;}
select.inp{-webkit-appearance:none;appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%235b6b64' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; padding-right:30px;}
.link{border:none; background:none; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:0;}

/* status pill colours reused on <select> */
.st-Draft{background:var(--draft-bg);}
.st-Sent{background:var(--sent-bg);}
.st-Accepted{background:var(--ok-bg); color:var(--accent); font-weight:700;}
.st-Rejected{background:var(--rej-bg); color:var(--danger); font-weight:700;}

/* ---- buttons ---- */
.btn{display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; border:1px solid transparent; cursor:pointer; white-space:nowrap;}
.btn:disabled{opacity:.55; cursor:default;}
.btn-primary{background:var(--green); color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--green-2);}
.btn-outline{background:var(--card); border-color:var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted);}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}

/* ---- tiles (dashboard) ---- */
.tile{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; cursor:pointer; color:var(--ink);}
.tile-primary{background:linear-gradient(135deg,var(--green),var(--green-2)); color:#fff; border-color:transparent;}
.tile-primary .tile-s{color:rgba(255,255,255,.85);}
.tile-t{font-weight:800; font-size:16px;}
.tile-s{font-size:12.5px; color:var(--muted);}

/* ---- data table (desktop list) ---- */
.dt{width:100%; border-collapse:collapse; font-size:13.5px;}
.dt th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
.dt td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
.dt tr:last-child td{border-bottom:none;}

/* ---- summary box ---- */
.summary{background:var(--bg); border:1px solid var(--line);}
.bd{border-color:var(--line);}

/* ---- segmented control (mobile form/preview) ---- */
.seg{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:3px;}
.seg button{display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border:none; background:transparent; border-radius:9px; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer;}
.seg button.on{background:var(--card); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---- sticky action bar ---- */
.actionbar{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 0; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:20;}

/* ---- banner ---- */
.banner{display:flex; align-items:flex-start; gap:8px; padding:12px 14px; border-radius:12px; font-size:13px;}
.banner-warn{background:var(--warn-bg); color:var(--warn-ink);}

/* ---- toast ---- */
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:toastin .18s ease-out; max-width:88vw; text-align:center;}
.toast-err{background:var(--danger);}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

/* ---- modal ---- */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:16px;}
.modal{width:100%; max-width:480px; max-height:86vh; overflow:auto;}

/* ---- logo box (settings) ---- */
.logo-box{width:72px; height:72px; border:1px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--bg);}
.logo-box img{max-width:100%; max-height:100%; object-fit:contain;}

/* =========================================================
   A4 QUOTATION SHEET
   ========================================================= */
.paper-frame{overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.12); border-radius:4px;}
.sheet{
  width:794px; height:1123px; background:#ffffff; color:#16211c;
  padding:34px 40px 26px; font-family:Georgia,'Times New Roman',serif;
  display:flex; flex-direction:column;
}
.sh-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:3px solid #0f6b4c; padding-bottom:12px;}
.sh-brand{display:flex; align-items:center; gap:12px;}
.sh-logo{width:44px; height:44px; object-fit:contain;}
.sh-name{font-size:20px; font-weight:700; color:#0a4d38; letter-spacing:.02em; font-family:Arial,Helvetica,sans-serif;}
.sh-unit{font-size:10.5px; color:#55655e; font-style:italic; font-family:Arial,Helvetica,sans-serif;}
.sh-contact{text-align:right; font-size:9.5px; color:#55655e; font-family:Arial,Helvetica,sans-serif; line-height:1.5;}
.sh-title{text-align:center; font-size:14.5px; font-weight:700; letter-spacing:.06em; color:#0b2e4e; margin:12px 0 8px; font-family:Arial,Helvetica,sans-serif;}
.sh-meta{display:flex; justify-content:space-between; font-size:10.5px; background:#f4f7f5; border-radius:6px; padding:7px 14px; font-family:Arial,Helvetica,sans-serif;}
.sh-meta .k{color:#5b6b64; margin-right:5px;}
.sh-meta .v{font-weight:700; color:#16211c;}
.sh-body{flex:1; font-family:Arial,Helvetica,sans-serif;}
.cust{display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; font-size:10.5px; background:#f9fbfa; border:1px solid #e2e8e4; border-radius:6px; padding:9px 14px;}
.cust .span2{grid-column:1/-1;}
.cust .k{display:block; color:#5b6b64; font-size:9px; text-transform:uppercase; letter-spacing:.03em;}
.cust .v{display:block; font-weight:600; color:#16211c;}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.tb{width:100%; border-collapse:collapse; font-size:10px; margin-top:2px;}
.tb th{background:#0f6b4c; color:#fff; text-align:left; padding:5px 8px; font-size:9px; text-transform:uppercase; letter-spacing:.03em;}
.tb th.r{text-align:right;}
.tb td{padding:5px 8px; border-bottom:1px solid #e2e8e4; color:#33403a;}
.tb td.r{text-align:right;}
.tb td.b{font-weight:700; color:#16211c;}
.tb .cap{display:block; font-size:8px; color:#8a938d; font-weight:400;}
.tb tr.tot td{background:#e9f4ef; font-weight:800; font-size:12.5px; color:#0a4d38; border-bottom:none; padding-top:7px; padding-bottom:7px;}
.tb tr.sum td{font-weight:800; color:#16211c; border-top:1.5px solid #16211c; border-bottom:none;}
.note{font-size:8.5px; color:#8a938d; font-style:italic; margin-top:4px;}
.terms{font-size:9px; color:#33403a; column-count:1; margin-top:2px;}
.terms .t{display:flex; gap:5px; padding:1.5px 0;}
.terms .t b{flex-shrink:0;}
.sign{display:flex; justify-content:flex-end; margin-top:16px;}
.sign .fo{font-size:10px; font-weight:700; margin-bottom:26px;}
.sign .line{font-size:9.5px; border-top:1px solid #16211c; padding-top:3px; width:170px; text-align:center; color:#33403a;}
.sh-foot{display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid #e2e8e4; padding-top:8px; font-size:8.5px; color:#5b6b64; font-family:Arial,Helvetica,sans-serif;}
.sh-foot b{color:#0a4d38;}

/* on-screen: hide the full-size print root, show only the scaled preview */
#print-root{position:fixed; left:-99999px; top:0; z-index:-1;}

/* =========================================================
   PRINT
   ========================================================= */
@media print{
  @page{ size:A4; margin:0; }
  html,body{ background:#fff !important; }
  body *{ visibility:hidden !important; }
  #print-root, #print-root *{ visibility:visible !important; }
  #print-root{ position:static !important; left:0 !important; z-index:1 !important; }
  .sheet{ box-shadow:none !important; width:210mm !important; height:297mm !important; margin:0 !important; }
}

</style>
</head>
